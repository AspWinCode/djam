name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: game_game
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d game_game"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      # MinIO pulled its images from Docker Hub and quay.io now refuses anonymous pulls
      # (both minio/minio and quay.io/minio/minio return "unauthorized"/"access denied" as
      # of October 2026), so build-and-verify can no longer use it as the S3-compatible
      # service for CI. adobe/s3mock is a real, actively maintained S3-API-compatible mock
      # (Apache 2.0, freely pullable) — verified locally: CreateBucket, HeadBucket, PutObject
      # and GetObject all round-trip correctly against it, which is all the app's upload
      # pipeline needs. Pinned to a specific release, not :latest, for reproducibility.
      s3mock:
        image: adobe/s3mock:4.11.0
        ports:
          - 9000:9090
        options: >-
          --health-cmd="wget -q -O /dev/null http://localhost:9090/ || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/game_game?schema=public
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      NEXT_PUBLIC_SOCKET_URL: http://localhost:4000
      STORAGE_PROVIDER: s3
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: game-game-media
      # s3mock does not validate signatures/credentials; these just need to be present
      # so the AWS SDK client has something to sign requests with.
      S3_ACCESS_KEY_ID: s3mock
      S3_SECRET_ACCESS_KEY: s3mock
      S3_FORCE_PATH_STYLE: "true"
      S3_PUBLIC_BASE_URL: http://localhost:9000/game-game-media
      S3_CREATE_BUCKET_IF_MISSING: "true"
      AUTH_ALLOWED_ORIGINS: http://localhost:3000
      AUTH_COOKIE_SECURE: "false"
      AUTH_ALLOW_MISSING_ORIGIN: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npm --workspace @game-game/api run prisma:generate

      - name: Apply migrations
        run: npx prisma migrate deploy
        working-directory: apps/api

      - name: Seed database
        run: npm --workspace @game-game/api run prisma:seed

      - name: Lint API
        run: npm --workspace @game-game/api run lint

      - name: Lint web
        run: npm --workspace @game-game/web run lint

      - name: Build API
        run: npm --workspace @game-game/api run build

      - name: Trainer notification regression tests
        run: node --test tests/trainer-notifications.test.mjs

      - name: Build web
        run: npm --workspace @game-game/web run build

      - name: Start API
        run: npm run dev:api > api.log 2>&1 &

      - name: Start web
        run: npm run dev:web > web.log 2>&1 &

      - name: Wait for API
        run: npx wait-on http://localhost:4000/api/health

      - name: Wait for web
        run: npx wait-on http://localhost:3000

      - name: Smoke test
        shell: pwsh
        run: ./scripts/smoke-mvp.ps1

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-logs
          path: |
            api.log
            web.log
