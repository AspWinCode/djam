name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: game_game
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d game_game"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd="curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        command: server /data --console-address ":9001"

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/game_game?schema=public
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      NEXT_PUBLIC_SOCKET_URL: http://localhost:4000
      STORAGE_PROVIDER: s3
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: game-game-media
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      S3_PUBLIC_BASE_URL: http://localhost:9000/game-game-media
      S3_CREATE_BUCKET_IF_MISSING: "true"
      AUTH_ALLOWED_ORIGINS: http://localhost:3000
      AUTH_COOKIE_SECURE: "false"
      AUTH_ALLOW_MISSING_ORIGIN: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npm --workspace @game-game/api run prisma:generate

      - name: Apply migrations
        run: npx prisma migrate deploy
        working-directory: apps/api

      - name: Seed database
        run: npm --workspace @game-game/api run prisma:seed

      - name: Lint API
        run: npm --workspace @game-game/api run lint

      - name: Lint web
        run: npm --workspace @game-game/web run lint

      - name: Build API
        run: npm --workspace @game-game/api run build

      - name: Trainer notification regression tests
        run: node --test tests/trainer-notifications.test.mjs

      - name: Build web
        run: npm --workspace @game-game/web run build

      - name: Start API
        run: npm run dev:api > api.log 2>&1 &

      - name: Start web
        run: npm run dev:web > web.log 2>&1 &

      - name: Wait for API
        run: npx wait-on http://localhost:4000/api/health

      - name: Wait for web
        run: npx wait-on http://localhost:3000

      - name: Smoke test
        shell: pwsh
        run: ./scripts/smoke-mvp.ps1

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-logs
          path: |
            api.log
            web.log
